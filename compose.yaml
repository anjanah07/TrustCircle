services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: trustcircle
      POSTGRES_PASSWORD: trustcircle
      POSTGRES_DB: trustcircle
    ports:
      - "5432:5432"
    volumes:
      - trustcircle-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustcircle"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  trustcircle-data:
